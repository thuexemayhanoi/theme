name: Legal source check (read-only)

# One GET of the official consolidated Law on Road Traffic Order and Safety, then a text check that the
# provisions used by the 50cc and electric-vehicle pages (Điều 34, 56, 57, 59) are in it. Nothing is written
# to WordPress. Start it by hand, or it runs when the check itself changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/qa/legal-source-check.mjs'
      - 'tools/qa/lib/legal-provisions.mjs'
      - 'tests/node/legal-provisions.test.mjs'
      - '.github/workflows/legal-source-check.yml'

permissions:
  contents: read

concurrency:
  group: legal-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/node/legal-provisions.test.mjs
      - name: Install pdftotext
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Read the official PDF and check the provisions
        run: node tools/qa/legal-source-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-source-evidence
          retention-days: 30
          path: reports/legal-source/evidence.json

name: Assistant live QA

# Read-only check of the chat assistant on https://thuexemaynguyentu.com/ (tools/qa/assist-live.mjs): the home page is read with
# GET, non-sensitive questions go to the public REST endpoint the assistant itself uses, and Chromium opens the chat at
# 390/360/768/1024/1440 px in light and dark mode. Nothing is written to WordPress, no cookie or form is used.
#   pull request   label "before": the live site still runs the old assistant. Failed checks are the reproduced bugs and are
#                  reported, never an error. The evidence carries the SHA-256 of the served assist.js / assist.css, the SEO
#                  fingerprint and the Quick Call menu, so "after" can be compared with it.
#   push to main   label "after": waits until the six chips are served, then every check must pass.
#   manual         either label.
# A page cache that still serves the old page is reported, never fixed from here. Chromium emulation is not native Safari.
on:
  pull_request:
    paths:
      - 'tools/qa/assist-live.mjs'
      - 'tools/qa/lib/assist-cases.mjs'
      - 'inc/assist.php'
      - 'assets/js/assist.js'
      - 'assets/css/assist.css'
      - 'assets/css/color-mode.css'
      - '.github/workflows/assistant-live-qa.yml'
  push:
    branches: [main]
    paths:
      - 'tools/qa/assist-live.mjs'
      - 'tools/qa/lib/assist-cases.mjs'
      - 'inc/assist.php'
      - 'assets/js/assist.js'
      - 'assets/css/assist.css'
      - 'assets/css/color-mode.css'
      - '.github/workflows/assistant-live-qa.yml'
  workflow_dispatch:
    inputs:
      label:
        description: 'before (the change is not live yet; failed checks are informational) or after (waits for the deploy; every check must pass)'
        default: 'after'
      wait_minutes:
        description: 'After: minutes to wait for the six chips to be served'
        default: '15'

permissions:
  contents: read

concurrency:
  group: assistant-live-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Assistant on the live site (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LABEL: ${{ github.event_name == 'pull_request' && 'before' || (github.event_name == 'push' && 'after') || inputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the assistant on the live site
        env:
          WAIT_MINUTES: ${{ inputs.wait_minutes || '15' }}
        run: node tools/qa/assist-live.mjs --label "$LABEL" --wait-minutes "$WAIT_MINUTES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-live-evidence-${{ env.LABEL }}
          path: reports/assistant-live/

name: SEO matrix live QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'inc/schema.php'
      - 'tools/qa/seo-matrix-live.mjs'
      - '.github/workflows/seo-matrix-live.yml'

permissions:
  contents: read

concurrency:
  group: seo-matrix-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Read-only live mobile and desktop verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/qa/seo-matrix-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-matrix-live-evidence
          path: reports/seo-matrix-live/

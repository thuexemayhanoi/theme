name: WooCommerce final live QA

# Public read-only GET checks. PR mode records the pre-deploy baseline; main mode
# validates the new button labels AFTER deploy. No authenticated WordPress writes.
on:
  pull_request:
    paths:
      - 'inc/woocommerce.php'
      - 'assets/css/woo.css'
      - 'tests/e2e/woo.spec.mjs'
      - 'tools/qa/woo-final-live.mjs'
      - '.github/workflows/woocommerce-final-live-qa.yml'
  push:
    branches: [main]
    paths:
      - 'inc/woocommerce.php'
      - 'assets/css/woo.css'
      - 'tools/qa/woo-final-live.mjs'
      - '.github/workflows/woocommerce-final-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woo-final-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify 13 published products and Woo mobile CLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect production site without writes
        run: node tools/qa/woo-final-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: woo-final-live-evidence
          path: reports/woo-final-live/

name: Homepage live QA

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'inc/**'
      - 'template-parts/**'
      - 'tools/qa/homepage-live.mjs'
      - '.github/workflows/homepage-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-live-qa
  cancel-in-progress: true

jobs:
  verify:
    name: Verify deployed homepage in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for native component and verify public frontend
        run: node tools/qa/homepage-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-live-evidence
          path: reports/homepage-live/

name: Static pages live QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'page.php'
      - 'inc/pages.php'
      - 'assets/css/pages.css'
      - 'template-parts/pages/**'
      - 'tools/qa/static-pages-live.mjs'

permissions:
  contents: read

concurrency:
  group: static-pages-live-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify eight static pages and homepage/shop exclusions
        run: node tools/qa/static-pages-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-pages-live-evidence
          path: reports/static-pages/live/

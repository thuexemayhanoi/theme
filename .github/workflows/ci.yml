name: CI

# A branch with an open pull request would run every job twice (push and pull_request), so pushes only
# trigger CI on main; branches are covered by their pull request, and workflow_dispatch runs it by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, unit tests, QA gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP and Node tooling
        run: |
          composer install --no-interaction --no-progress
          npm ci
      - name: PHP lint, PHPCS, PHPUnit (unit)
        run: bash tools/qa/run-all.sh
      - name: Package theme and plugin
        run: |
          bash tools/build-theme-zip.sh
          bash tools/build-plugin-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-results-static
          path: reports/results/*.json

  sandbox:
    name: WordPress sandbox (integration, e2e, SEO rules)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: static
    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, intl, mbstring, zip, curl
          tools: composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install tooling
        run: |
          composer install --no-interaction --no-progress
          npm ci
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          sudo chown -R "$USER" "$PLAYWRIGHT_BROWSERS_PATH"
          npx playwright install --with-deps chromium
      - name: Make room for MariaDB (the runner image ships MySQL, which conflicts with it)
        run: |
          sudo systemctl stop mysql || true
          sudo apt-get purge -y 'mysql-*' || true
          sudo apt-get autoremove -y || true
      # The sandbox starts its own MariaDB with unix-socket root auth and installs packages with apt,
      # so these steps run as root. Nothing here touches any real site.
      - name: Build the disposable WordPress (core 7.1.3, WooCommerce, Yoast, MariaDB)
        run: |
          sudo -E env "PATH=$PATH" bash tools/sandbox/setup.sh
          sudo -E env "PATH=$PATH" bash tools/sandbox/seed.sh
      - name: Run sandbox gates
        run: sudo -E env "PATH=$PATH" bash tools/qa/run-sandbox.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-reports
          path: |
            reports/screenshots
            reports/*.md
            reports/results/*.json
            reports/seo-after.json
            reports/seo-rules-after.json
            reports/legacy-recovery-sandbox.json
            playwright-report
            test-results
